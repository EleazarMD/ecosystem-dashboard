<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <pattern id="pokeball" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Background -->
      <rect width="200" height="200" fill="#1a1a2e"/>
      <!-- Pokeball top half (red) -->
      <circle cx="100" cy="100" r="70" fill="#ee1515" stroke="#ffffff" stroke-width="6"/>
      <!-- Pokeball bottom half (white) -->
      <path d="M 30 100 A 70 70 0 0 0 170 100 L 30 100 Z" fill="#f0f0f0" stroke="#ffffff" stroke-width="6"/>
      <!-- Center band -->
      <rect x="30" y="93" width="140" height="14" fill="#ffffff"/>
      <!-- Center button -->
      <circle cx="100" cy="100" r="18" fill="#ffffff" stroke="#3b3b3b" stroke-width="4"/>
      <circle cx="100" cy="100" r="8" fill="#f0f0f0" stroke="#3b3b3b" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#pokeball)"/>
</svg>
