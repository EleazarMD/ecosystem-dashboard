<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <pattern id="types" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Electric yellow -->
      <rect x="0" y="0" width="50" height="50" fill="#f7d02c" opacity="0.15"/>
      <!-- Fire red -->
      <rect x="50" y="0" width="50" height="50" fill="#ee8130" opacity="0.15"/>
      <!-- Water blue -->
      <rect x="0" y="50" width="50" height="50" fill="#6390f0" opacity="0.15"/>
      <!-- Grass green -->
      <rect x="50" y="50" width="50" height="50" fill="#7ac74c" opacity="0.15"/>
      <!-- Small pokeball in each cell -->
      <circle cx="25" cy="25" r="8" fill="none" stroke="#ee1515" stroke-width="1.5" opacity="0.3"/>
      <line x1="17" y1="25" x2="33" y2="25" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
      <circle cx="75" cy="25" r="8" fill="none" stroke="#ee8130" stroke-width="1.5" opacity="0.3"/>
      <line x1="67" y1="25" x2="83" y2="25" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
      <circle cx="25" cy="75" r="8" fill="none" stroke="#6390f0" stroke-width="1.5" opacity="0.3"/>
      <line x1="17" y1="75" x2="33" y2="75" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
      <circle cx="75" cy="75" r="8" fill="none" stroke="#7ac74c" stroke-width="1.5" opacity="0.3"/>
      <line x1="67" y1="75" x2="83" y2="75" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="#1a1a2e"/>
  <rect width="400" height="400" fill="url(#types)"/>
</svg>
